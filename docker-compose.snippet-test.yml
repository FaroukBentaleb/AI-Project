# Lightweight local test of snippet-service, UI included, on a small machine (8 GB RAM) whose 5432 and 8080 are
# already taken (local PostgreSQL / Oracle).
#
#   F="-f docker-compose.yml -f docker-compose.snippet-test.yml"
#   docker compose $F up -d --build
#   -> UI http://localhost:4200/snippets   gateway http://localhost:8090   Postgres localhost:5433
#
# Starts only 6 containers: eureka-server, postgres, api-gateway, snippet-model, snippet-service, frontend
# (the commit/sql/bug/review services and Qdrant are parked in a profile that is never enabled).
#   - postgres is published on host port 5433 and the gateway on 8090.
#   - the frontend image is rebuilt with the API URL pointed at the gateway on 8090 (no repo file is changed).
#   - the three Spring Boot JVMs are capped so everything fits in ~3.7 GB of Docker memory.
services:
  # Not needed to test snippets: a profile nobody enables keeps them out of a plain `up`.
  commit-model:
    profiles: ["not-in-snippet-test"]
  commit-service:
    profiles: ["not-in-snippet-test"]
  sql-service:
    profiles: ["not-in-snippet-test"]
  bug-service:
    profiles: ["not-in-snippet-test"]
  review-service:
    profiles: ["not-in-snippet-test"]
  qdrant:
    profiles: ["not-in-snippet-test"]

  postgres:
    ports: !override
      - "5433:5432"

  api-gateway:
    ports: !override
      - "8090:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:+UseSerialGC

  eureka-server:
    environment:
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:+UseSerialGC

  snippet-model:
    environment:
      # float32 (~2.2 GB, the default of docker-compose.yml) gets OOM-killed (exit 137) with only 3.7 GB for Docker;
      # bfloat16 needs about 1.1 GB. On a machine with 6 GB+ for Docker, delete this line.
      SNIPPET_DTYPE: bfloat16

  snippet-service:
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC
      # CPU inference can take 20-60 s on a small machine.
      SNIPPET_MODEL_READ_TIMEOUT: 120s

  frontend:
    build: !override
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json .
        RUN npm install
        COPY . .
        RUN sed -i 's#localhost:8080#localhost:8090#' src/environments/environment.ts && npm run build
        FROM nginx:alpine
        COPY --from=build /app/dist/devassist-hub/browser /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf

# Reuse the base model already downloaded by the standalone test run instead of downloading it again.
volumes:
  snippet-model-cache:
    external: true
    name: snippet-model-cache
