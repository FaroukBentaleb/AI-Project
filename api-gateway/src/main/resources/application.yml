server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:4200}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: "*"
      routes:
        - id: commit-service
          uri: lb://commit-service
          predicates: [Path=/api/commits/**]
        - id: snippet-service
          uri: lb://snippet-service
          predicates: [Path=/api/snippets/**]
        - id: bug-service
          uri: lb://bug-service
          predicates: [Path=/api/bugs/**]
        - id: sql-service
          uri: lb://sql-service
          predicates: [Path=/api/sql/**]
          metadata:
            # ms; above sql-service's 13 s generation deadline. Plan B (docker-compose.planb.yml) sets 22000.
            response-timeout: ${SQL_ROUTE_RESPONSE_TIMEOUT_MS:15000}
        - id: review-service
          uri: lb://review-service
          predicates: [Path=/api/reviews/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
