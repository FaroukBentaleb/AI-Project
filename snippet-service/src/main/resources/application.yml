server.port: ${SERVER_PORT:8082}
spring:
  application.name: snippet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snippet_db}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa.hibernate.ddl-auto: validate
  jackson.property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
management.endpoints.web.exposure.include: health,info
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
# Model service (FastAPI): POST {url}/generate {"code": "...", "language": "..."} -> {"docstring": "..."}
snippet:
  model:
    url: ${SNIPPET_MODEL_URL:http://localhost:8001}
    connect-timeout: ${SNIPPET_MODEL_CONNECT_TIMEOUT:2s}
    read-timeout: ${SNIPPET_MODEL_READ_TIMEOUT:30s}
    retry-max-attempts: ${SNIPPET_MODEL_RETRY_MAX_ATTEMPTS:2}
    # The fine-tuned model has a short context: the code is cut to this length before it is sent
    # (keep equal to MAX_CODE_CHARS in snippet-service/ai/snippet_prompt.py).
    max-code-chars: ${SNIPPET_MODEL_MAX_CODE_CHARS:2500}
