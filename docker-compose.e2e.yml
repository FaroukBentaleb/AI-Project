# Story 8.1 E2E override: points sql-service's generation and embedding calls at a local deterministic stub
# instead of Hugging Face. Only sql-service is reconfigured; every other service runs as in docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build llm-stub sql-service
#   node scripts/e2e/uj1-e2e.mjs
#   docker compose up -d sql-service          # back to the real provider afterwards
#
# The stub needs no token: a dummy value keeps LLM_NOT_CONFIGURED out of the way; the real HF_API_TOKEN is never
# sent to the stub. A separate Qdrant collection keeps stub vectors out of the real sql_embeddings collection.
services:
  llm-stub:
    image: python:3.12-alpine
    command: ["python", "-u", "/stub/stub.py"]
    environment:
      PORT: 8099
      EMBEDDING_DIM: 384
    volumes:
      - ./scripts/e2e/llm-stub:/stub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sql-service:
    environment:
      HF_API_TOKEN: e2e-stub-token
      HF_MODEL: stub/sqlcoder
      HF_EMBEDDING_MODEL: stub/embedder
      HF_EMBEDDING_DIMENSION: 384
      HF_BASE_URL: http://llm-stub:8099
      HF_EMBEDDING_BASE_URL: http://llm-stub:8099
      QDRANT_COLLECTION: sql_embeddings_e2e
    depends_on:
      llm-stub:
        condition: service_healthy
