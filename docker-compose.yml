services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      COMMIT_DB_USER: ${COMMIT_DB_USER}
      COMMIT_DB_PASSWORD: ${COMMIT_DB_PASSWORD}
      SNIPPET_DB_USER: ${SNIPPET_DB_USER}
      SNIPPET_DB_PASSWORD: ${SNIPPET_DB_PASSWORD}
      BUG_DB_USER: ${BUG_DB_USER}
      BUG_DB_PASSWORD: ${BUG_DB_PASSWORD}
      SQL_DB_USER: ${SQL_DB_USER}
      SQL_DB_PASSWORD: ${SQL_DB_PASSWORD}
      REVIEW_DB_USER: ${REVIEW_DB_USER}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/00-create-users.sh:/docker-entrypoint-initdb.d/00-create-users.sh:ro
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    # Pinned to the version used by sql-service's Testcontainers ITs.
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The image ships no curl/wget; bash /dev/tcp issues a plain HTTP request to /readyz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Commit-message model behind POST /generate. Serves the rule-based fallback until a trained adapter is placed in
  # commit-service/ai/model/adapter and COMMIT_MODEL_REAL=1 is set (see commit-service/ai/README.md).
  commit-model:
    build:
      context: ./commit-service/ai
      args:
        WITH_MODEL: ${COMMIT_MODEL_REAL:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./commit-service/ai/model:/app/model:ro
      - commit-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start downloads the base model (~1 GB) when the real model is enabled.
      start_period: 30s

  review-ai:
    build: ./review-service/ai
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - review-ai-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  commit-service:
    build: ./commit-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${COMMIT_DB}
      SPRING_DATASOURCE_USERNAME: ${COMMIT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${COMMIT_DB_PASSWORD}
      COMMIT_MODEL_URL: http://commit-model:8000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      commit-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Docstring model behind POST /generate: the fine-tuned adapter in snippet-service/ai/model/adapter on top of
  # Qwen2.5-Coder-0.5B (see snippet-service/ai/README.md). It refuses to start without the adapter.
  snippet-model:
    build: ./snippet-service/ai
    ports:
      - "8001:8000"
    volumes:
      - ./snippet-service/ai/model:/app/model:ro
      - snippet-model-cache:/root/.cache/huggingface
    environment:
      # Empty = float32 on CPU (~2.2 GB of RAM, fastest on CPUs without native bfloat16). Tunable from .env.
      SNIPPET_DTYPE: ${SNIPPET_DTYPE:-}
      # Longest docstring in tokens: lower it (e.g. 100) to answer faster on a slow CPU.
      SNIPPET_MAX_NEW_TOKENS: ${SNIPPET_MAX_NEW_TOKENS:-160}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 90
      # The first start downloads the base model (~1 GB, 5-20 min on a slow link) and loads it before answering.
      start_period: 300s

  snippet-service:
    build: ./snippet-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${SNIPPET_DB}
      SPRING_DATASOURCE_USERNAME: ${SNIPPET_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SNIPPET_DB_PASSWORD}
      SNIPPET_MODEL_URL: http://snippet-model:8000
      # CPU generation can take a while; one attempt only, since the model serves one request at a time and a retry
      # would just queue a second generation behind the first.
      SNIPPET_MODEL_READ_TIMEOUT: ${SNIPPET_MODEL_READ_TIMEOUT:-120s}
      SNIPPET_MODEL_RETRY_MAX_ATTEMPTS: ${SNIPPET_MODEL_RETRY_MAX_ATTEMPTS:-1}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      snippet-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bug-service:
    build: ./bug-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${BUG_DB}
      SPRING_DATASOURCE_USERNAME: ${BUG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${BUG_DB_PASSWORD}
      # bug-service's own triage LLM (any OpenAI-compatible chat endpoint), independent of the shared HF_MODEL.
      # Defaults: the shared HF token on the Hugging Face router. For Groq: BUG_LLM_BASE_URL=https://api.groq.com/openai/v1.
      HF_API_TOKEN: ${BUG_LLM_API_KEY:-${HF_API_TOKEN}}
      HF_MODEL: ${BUG_LLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      HF_BASE_URL: ${BUG_LLM_BASE_URL:-https://router.huggingface.co/v1}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sql-service:
    build: ./sql-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${SQL_DB}
      SPRING_DATASOURCE_USERNAME: ${SQL_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SQL_DB_PASSWORD}
      HF_API_TOKEN: ${HF_API_TOKEN}
      # sql-service's own generation model, independent of the shared HF_MODEL used by the other services.
      HF_MODEL: ${SQL_HF_MODEL:-defog/sqlcoder-7b-2}
      HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL}
      JINA_API_KEY: ${JINA_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      HF_RETRY_MAX_ATTEMPTS: 1
      # Story 8.2: demo profile (INFO logs, LLM-down switch SQL_DEMO_LLM_DEAD_HOST). Plan B: docker-compose.planb.yml.
      SPRING_PROFILES_ACTIVE: ${SQL_SPRING_PROFILES:-demo}
      SQL_DEMO_LLM_DEAD_HOST: ${SQL_DEMO_LLM_DEAD_HOST:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_REST_PORT: 6333
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  review-service:
    build: ./review-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${REVIEW_DB}
      SPRING_DATASOURCE_USERNAME: ${REVIEW_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${REVIEW_DB_PASSWORD}
      REVIEW_AI_URL: http://review-ai:8000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      review-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  qdrant-storage:
  commit-model-cache:
  review-ai-cache:
  snippet-model-cache:
