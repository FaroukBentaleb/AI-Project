name: sql-service CI

on:
  push:
    branches:
      - 'feature/sql-service-*'
      - develop
    paths:
      - 'sql-service/**'
      - '.github/workflows/sql-service-ci.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'sql-service/**'
      - '.github/workflows/sql-service-ci.yml'

permissions:
  contents: read

concurrency:
  group: sql-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sql-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sql-service/pom.xml

      # Unit tests (surefire) + Testcontainers PostgreSQL integration tests (failsafe, *IT)
      # run against the runner's Docker daemon.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sql-service-test-reports
          path: |
            sql-service/target/surefire-reports/
            sql-service/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  image-smoke:
    name: Image smoke (docker build + /actuator/health)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sql_db
          POSTGRES_USER: sql_user
          POSTGRES_PASSWORD: sql_smoke_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sql_user -d sql_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sql-service:ci sql-service

      # Eureka disabled; Qdrant and HF deliberately unreachable/empty (FR19, FR21).
      - name: Start container
        run: |
          docker run -d --name sql-service-smoke --network host \
            -e SERVER_PORT=8084 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/sql_db \
            -e SPRING_DATASOURCE_USERNAME=sql_user \
            -e SPRING_DATASOURCE_PASSWORD=sql_smoke_pw \
            -e EUREKA_CLIENT_ENABLED=false \
            -e QDRANT_HOST=127.0.0.1 \
            -e QDRANT_PORT=1 \
            -e HF_API_TOKEN= \
            -e HF_MODEL= \
            sql-service:ci

      - name: Wait for /actuator/health UP (90 s)
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8084/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthy after ~$((i * 2)) s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' sql-service-smoke)" != "true" ]; then
              echo "Container exited"; exit 1
            fi
            sleep 2
          done
          echo "Timed out after 90 s"; exit 1

      - name: Verify Flyway migrations applied
        run: |
          count=$(docker exec "${{ job.services.postgres.id }}" \
            psql -U sql_user -d sql_db -tAc "select count(*) from flyway_schema_history where success")
          echo "Successful Flyway migrations: $count"
          test "$count" -gt 0

      - name: Dump container logs
        if: failure()
        run: docker logs sql-service-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f sql-service-smoke || true

  # Story 2.4: build + tag on merge to develop. Push to GHCR is gated behind the
  # repository variable SQL_SERVICE_PUBLISH == 'true' (GHCR not yet confirmed by the team).
  publish:
    name: Publish image (develop)
    needs: [test, image-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/sql-service"
          short="${SHA::7}"
          {
            echo "develop=$image:develop"
            echo "sha=$image:sha-$short"
          } >> "$GITHUB_OUTPUT"

      - name: Build and tag image
        env:
          TAG_DEVELOP: ${{ steps.meta.outputs.develop }}
          TAG_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          docker build -t "$TAG_SHA" sql-service
          docker tag "$TAG_SHA" "$TAG_DEVELOP"

      - name: Log in to GHCR
        if: vars.SQL_SERVICE_PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: vars.SQL_SERVICE_PUBLISH == 'true'
        env:
          TAG_DEVELOP: ${{ steps.meta.outputs.develop }}
          TAG_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          docker push "$TAG_SHA"
          docker push "$TAG_DEVELOP"

      - name: Job summary
        env:
          TAG_DEVELOP: ${{ steps.meta.outputs.develop }}
          TAG_SHA: ${{ steps.meta.outputs.sha }}
          PUBLISH: ${{ vars.SQL_SERVICE_PUBLISH }}
        run: |
          {
            echo "### sql-service image"
            echo ""
            echo "- \`$TAG_DEVELOP\`"
            echo "- \`$TAG_SHA\`"
            echo ""
            if [ "$PUBLISH" = "true" ]; then
              echo "Pushed to GHCR."
            else
              echo "Built and tagged only (not pushed): set repository variable \`SQL_SERVICE_PUBLISH=true\` to enable publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
